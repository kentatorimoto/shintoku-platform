name: Watch Council Channel

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # UTC 00:00 = JST 09:00。議会は平日日中開催なので1日1回で足りる。

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 新着があれば Issue を立てる。字幕の有無は見ない（add-session 実行時に判定）。
      - run: npx tsx scripts/watch-council.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # daily-sync の教訓: グロブではなく明示パスでコミットする。
      - name: Commit known-videos.json if changed
        run: |
          git config user.name "shintoku-atlas-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/watch/known-videos.json
          git diff --cached --quiet || (git commit -m "chore: update known videos" && git push)
