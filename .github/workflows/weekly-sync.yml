name: Weekly Sync

# 町報の全文索引を作り直す。町報は月刊なので毎日走らせる意味がない。
# 毎日動かしていたときは、過去30日で実質的な内容変更が2回だけなのに
# コミットは30回（＝本番ビルド30回）だった。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # UTC 月曜 03:00 = JST 月曜 12:00

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 広報の全文は非公開の shintoku-corpus にある。公開リポジトリには入れない
      - uses: actions/checkout@v4
        with:
          repository: kentatorimoto/shintoku-corpus
          ssh-key: ${{ secrets.CORPUS_DEPLOY_KEY }}
          path: .corpus

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 広報の全文は pdftotext で取る
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # スクレイピング & インデックス生成
      - run: npm run sync
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}

      # スクレイパが更新するファイルだけを明示的にコミットする。
      # public/data/gikai_sessions.json と qna/ は content/ からの生成物なので、
      # このワークフローが触ってはいけない（build:data 以外の経路を作らない）。
      #
      # lastSync.json はコミットしない（そもそも書かなくなった）。
      # 画面から読まれていないのに日付1行が毎日変わり、ビルドの引き金になっていた。
      #
      # 全文は corpus に先に push する。公開側の索引が全文より先に進まないように。
      - name: Commit and push if changed
        run: |
          for dir in .corpus .; do
            git -C "$dir" config user.name "shintoku-atlas-bot"
            git -C "$dir" config user.email "actions@users.noreply.github.com"
          done

          git -C .corpus add koho
          git -C .corpus diff --cached --quiet || (git -C .corpus commit -m "chore: weekly newsletter text" && git -C .corpus push)

          git add data/koho public/data/koho
          git diff --cached --quiet || (git commit -m "chore: weekly newsletter index" && git push)
