name: Notify Workflow Failures

# 「スクリプトの外」で落ちたときに気づくための見張り。
#
# auto-ingest.ts は自分の中で起きた失敗を Telegram に投げるが、
# ワークフローの起動失敗（YAMLの不備・権限不足）やジョブ自体の失敗は誰も知らせない。
# 実際、watch-council が起動失敗しても通知は1通も飛ばなかった。
#
# **起動失敗では workflow_run イベントが発火しない**（実際に起動失敗させて確認した）。
# そのため workflow_run だけに頼らず、定期的に GitHub API を掃く。
#   - workflow_run: ジョブの失敗をすぐ知らせる
#   - schedule:     起動失敗を拾う（イベントが来ないので API を見るしかない）
# 二重に鳴らないよう、通知済みの run id は data/watch/notified-runs.json に残す。
#
# 母艦のセルフホストランナーが落ちていても届くよう ubuntu-latest で動かす。
# この見張り自身が落ちたときは誰も知らせない（Actions の実行履歴で見ること）。

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *" # 6時間ごと。起動失敗の取りこぼしを拾う
  workflow_run:
    workflows:
      - Watch Council Channel
      - Auto Ingest Sessions
      - Weekly Sync
      - Daily Scrape
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: notify-failures
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 失敗した実行を拾って通知する
        env:
          GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npx tsx scripts/notify-failed-runs.ts

      - name: Commit notified-runs.json if changed
        if: always()
        run: |
          if [ ! -f data/watch/notified-runs.json ]; then exit 0; fi

          git config user.name "shintoku-atlas-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/watch/notified-runs.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: update notified runs"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "${GITHUB_REF_NAME}"
          fi
