narrativeTitle: 20年ぶりの新体制——岩牧新町長と「オール新得」の始動
date: "2025-08-06"
tags:
  - 臨時会
  - 人口政策
  - 総合計画
summary:
  issues: 20年ぶりの町長選挙を経て岩牧新町長が初登庁。補欠選挙で4名の新議員が就任（12名中7名が新人）。新体制の委員会構成・役員選任と所信表明。トムラウシ・屈足・新得が一体となる「オール新得」まちづくりを宣言
  conflicts: 人口が4,000人・3,000人と減少していく現実に対し「寂れた可哀想な町」でなく「身の丈に合った心地よい暮らしが描ける町」へ。公共サービスの優先順位を町民と共に整理することが急務
  nextActions: 「オール新得」の具体施策立案と所信表明の政策化状況を確認。「対話と共感」を軸にした新体制の予算・政策方針の変化を追跡
