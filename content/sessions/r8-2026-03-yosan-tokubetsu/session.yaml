id: r8-2026-03-yosan-tokubetsu
officialTitle: 令和８年３月１６日・１７日 予算特別委員会（定例第１回）
narrativeTitle: 大型事業の持続性と指定管理の透明性を問う
date: "2026-03-16"
tags:
  - 当初予算
  - 財政
  - インフラ
  - 観光
  - 宿泊税
  - 教育
  - 物価高騰対策
  - 特別委員会
summary:
  issues: 令和8年度一般会計予算等を審査。地方債残高が約99億円に達し基金を上回る状況下で、駅前温浴施設・道の駅・スマートIC等の大型事業スケジュールと物価高騰対策を議論。宿泊税基金条例の創設、教員の働き方改革も審査。
  conflicts: 駅前温浴施設の指定管理者（新得タウンマネジメント）が収益部門の財務情報開示に厳しい条件を提示し、行政が困惑。施設の運営透明性が問題視された。寄付金活用の時計塔外構工事費の圧縮、ふるさと会への補助金の是非も議論。
  nextActions: 指定管理者との透明性ある経営に向けた協議の進捗と、駅前温浴施設9月完成・12月開業の実現状況を確認。
