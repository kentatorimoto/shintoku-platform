summary:
  issues: 補正予算+8,546万円（賃上げ・道の駅用地・医療DX）。犯罪被害者支援条例を新規制定。一般質問では農業防疫・バイオガス・空き家活用・宿泊税・地域医療を幅広く議論。最終日に新基本構想審査特別委員会を設置、こども誰でも通園制度を条例化
  conflicts: 集約型堆肥センター建設（議員提案）vs バイオセキュリティ懸念で断念（行政）。地域交流センター「特」の位置づけ（観光拠点 vs 日常利用）。新得クリニック閉院後の地域医療体制
  nextActions: 宿泊税R8年4月の徴収開始準備と使途の具体化。道の駅の指定管理者選定。新基本構想審査特別委員会での審査。空き家DIY補助の来年度予算化
