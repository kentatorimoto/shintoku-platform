id: r7-2025-09-kessan-tokubetsu
officialTitle: 令和７年９月１２日 決算特別委員会（令和６年度）
narrativeTitle: 貯金が借金を下回った日——令和６年度決算の転換点
date: "2025-09-12"
tags:
  - 決算
  - 財政
  - 医療
