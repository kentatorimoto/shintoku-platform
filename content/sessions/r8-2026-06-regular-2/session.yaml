summary:
  issues: 駅前温浴・宿泊施設の開業が重雪により来年4月以降に延期。一般会計補正予算（第2号）約3.6億円をインフラ・福祉・教育へ配分。農業委員11名の新体制も承認。
  conflicts: 帯広信用金庫新得支店の併設計画が一旦「白紙」に。温浴施設延期と併せ、駅前整備の見通しに不透明感。
  nextActions: 6月19日最終日での各議案採決結果、温浴施設の具体的な開業時期の確定、スマートIC・道の駅構想の土地購入費計上の詳細を注視。
