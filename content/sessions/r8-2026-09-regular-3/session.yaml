summary:
  issues: 9月1日から9月18日までの会期。令和7年度の決算認定3件は特別委員会に付託され、最終日に3件とも挙手全員で認定された。水道・下水道の料金改定（水道の平均改定率6.19%増・下水道12.22%増、営農用区分を新設）と、全26条の議会基本条例の制定を可決した。
  conflicts: 一般会計補正予算（第5号）は反対討論と賛成討論が行われ、挙手多数での可決となった。他の議案・認定・意見案は挙手全員で可決・認定され、軽油引取税の課税免除特例措置の継続を求める陳情は採択された。
  nextActions: 議会基本条例は令和9年1月1日、水道・下水道の新料金は令和9年4月1日に施行される（4月検針分のうち2月〜3月分は令和8年度料金）。町営浴場は温浴宿泊施設の工期延長に伴い運営を令和9年3月末まで4か月延長する。
