summary:
  issues: 令和7年度当初予算（議案第19号）の2日間にわたる審査。3本柱は①ゼロカーボンシティの実現②駅前再整備・スマートIC・道の駅③DX推進。物価高騰で人件費+1億超・委託料+7〜8千万。北斗クリニック3月閉院で約600名の患者移行が緊急課題
  conflicts: 北斗クリニック閉院後の医療空白：リハビリ機器・車椅子患者の移送手段確保（機器はサホロクリニックへの譲渡交渉中）。駅前ロータリーの逆走・冬期排雪スペース不足問題。交流施設「トクトク」のソフト事業継続財源
  nextActions: 北斗クリニック患者の移行完了状況（移行率70〜80%確認済み）と巡回診療体制を確認。医療機器更新向け新助成制度（10年サイクル）の創設状況を追跡
